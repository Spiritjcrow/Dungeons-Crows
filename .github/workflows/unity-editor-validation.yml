name: Unity 6 Editor Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-editor-validation.yml'
  push:
    branches:
      - 'selma/**'
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-editor-validation.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Unity 6 EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show requested Unity version
        shell: bash
        run: |
          set -euo pipefail
          cat UnityProject/ProjectSettings/ProjectVersion.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('UnityProject/Packages/manifest.json').read_text())
          print('Unity package manifest:')
          for name, version in sorted(manifest['dependencies'].items()):
              print(f'  {name}: {version}')
          PY

      - name: Validate Unity CI license inputs
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_LICENSE:-}" && ( -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ) ]]; then
            echo "::error::Unity CI is configured but no Unity activation is available. Provide UNITY_LICENSE for Personal, or the applicable Unity account/license secrets for your plan."
            exit 2
          fi
          echo "Unity activation inputs detected."

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('UnityProject/Packages/**', 'UnityProject/ProjectSettings/**', 'UnityProject/Assets/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Run Unity EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: UnityProject
          unityVersion: auto
          testMode: editmode
          artifactsPath: unity-test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Dungeons & Crows Unity EditMode

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn
